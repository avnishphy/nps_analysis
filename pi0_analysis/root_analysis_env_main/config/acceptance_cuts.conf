# Acceptance cuts for NPS pi0 analysis pipeline.
#
# Format:
#   [section-name]
#   key = value
#
# Special token:
#   auto
#     Uses stage-specific defaults for that field.
#
# Behavior:
#   - A section matching Kin_old is required (fail-fast if missing).
#   - Section inheritance is supported through: inherit = parent_section
#   - Keys omitted from a section are inherited from parent/global.

[global]
# ----------------------------
# HMS cuts used in data analysis
# ----------------------------
hms_data.edtm_tdc_max = 0.1
hms_data.react_z_min = -8.0
hms_data.react_z_max = 8.0
hms_data.delta_min = -10.0
hms_data.delta_max = 10.0
hms_data.gtr_th_min = -0.1
hms_data.gtr_th_max = 0.1
hms_data.gtr_ph_min = -0.04
hms_data.gtr_ph_max = 0.04
hms_data.cer_npe_sum_min = 5.0
hms_data.cal_etotnorm_min = 0.8
hms_data.cal_etotnorm_max = 1.2

# ----------------------------
# HMS cuts used in simulation producer
# (no EDTM/CER/CAL branches in SIM trees)
# ----------------------------
hms_sim.react_z_min = -8.0
hms_sim.react_z_max = 8.0
hms_sim.delta_min = -10.0
hms_sim.delta_max = 10.0
hms_sim.gtr_th_min = -0.1
hms_sim.gtr_th_max = 0.1
hms_sim.gtr_ph_min = -0.04
hms_sim.gtr_ph_max = 0.04

# ----------------------------
# NPS cluster acceptance
# ----------------------------
nps_cluster.energy_min = 0.8
nps_cluster.x_min = -30.0
nps_cluster.x_max = 30.0
nps_cluster.y_min = -36.0
nps_cluster.y_max = 36.0
nps_cluster.time_center_ns = 150.0

# If set to auto, stage/mode defaults are used:
#   analysis: derived from detected mode (hcana/waveform)
#   simulation producer: derived from mode hint (NPS_MODE) when available
nps_cluster.time_halfwidth_ns = auto
pairing.time_diff_max_ns = auto

# Controls accidental-sideband window style used in analysis plotting/background tools.
# auto => mode default
# false => unshifted/default windows
# true  => shifted waveform-style windows
#
# NOTE: This does not alter the fitted physics model itself; it controls timing-window
# groupings used for diagnostics/accidental subtraction bookkeeping.
timing.use_shifted_sidebands = auto

# Weighted exclusivity gate used when setting is_exclusive in output trees.
weighted.mmiss_corr_min = 0.8
weighted.mmiss_corr_max = 1.1

